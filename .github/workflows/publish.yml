name: Publish

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Setup AWS
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID \
          && aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY \
          && aws configure set region $AWS_REGION
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
      - name: Restore build cache from S3
        run: |
          set -euo pipefail
          mkdir -p _site/img .cache
          aws s3 sync --endpoint=$AWS_ENDPOINT_URL s3://$S3_BUCKET_NAME/img _site/img
          aws s3 sync --endpoint=$AWS_ENDPOINT_URL s3://$S3_BUCKET_NAME/eleventy-cache .cache
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Prune unreferenced images
        run: node scripts/prune-images.mjs _site
      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Save build cache to S3
        run: |
          set -euo pipefail
          aws s3 sync --delete --endpoint=$AWS_ENDPOINT_URL _site/img s3://$S3_BUCKET_NAME/img
          aws s3 sync --delete --endpoint=$AWS_ENDPOINT_URL .cache s3://$S3_BUCKET_NAME/eleventy-cache
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
  deploy:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v5
